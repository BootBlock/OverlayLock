[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Development tasks for OverlayLock (cargo xtask <command>)."
license = "MIT"
publish = false

[dependencies]
# Matrix3x2 and Vector2 for Direct2D: part of the windows crate family, which re-exports neither.
# Keep it at the version the windows crate depends on (see .github/dependabot.yml).
windows-numerics = "0.3.1"

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
