name: Release

# A release starts in one of two ways, and both give the same result: one zip per target with
# SHA-256 sums, published on the Releases page.
# - Push a tag `v<version>` that matches the `Cargo.toml` version.
# - Run this workflow by hand from the Actions tab, on `main`. It tags the commit it builds as
#   `v<version>` from `Cargo.toml`, so bump the version before each release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish the release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-11-08
        with:
          toolchain: stable
          targets: aarch64-pc-windows-msvc
      - name: Work out the version and the tag
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'overlay-lock' | Select-Object -ExpandProperty version
          $tag = "v$version"
          if ($env:EVENT -eq 'push') {
            if ($env:REF_NAME -ne $tag) {
              Write-Error "Tag $env:REF_NAME does not match the Cargo.toml version $tag."
              exit 1
            }
          } else {
            if ($env:REF -ne 'refs/heads/main') {
              Write-Error "Run a release from main, not $env:REF."
              exit 1
            }
            # `--exit-code` gives 2 when the tag is absent; anything else but 0 is a failure.
            git ls-remote --exit-code --tags origin "refs/tags/$tag" | Out-Null
            switch ($LASTEXITCODE) {
              0 { Write-Error "Tag $tag already exists. Raise the version in Cargo.toml first."; exit 1 }
              2 { $global:LASTEXITCODE = 0 }
              default { Write-Error "git ls-remote failed with exit code $LASTEXITCODE."; exit 1 }
            }
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - name: Test
        run: cargo test --workspace --locked
      - name: Build and package
        # The same command a maintainer runs locally: zips and SHA256SUMS.txt in !Distribution.
        run: cargo run --locked --package xtask -- dist
      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.sha }}
          PRERELEASE: ${{ inputs.prerelease || false }}
        run: |
          $flags = @('--generate-notes', '--target', $env:SHA, '--title', "OverlayLock $env:TAG")
          if ($env:PRERELEASE -eq 'true') { $flags += '--prerelease' }
          gh release create $env:TAG @flags (Get-ChildItem -LiteralPath '!Distribution' -File).FullName
