[package]
name = "overlay-lock"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
description = "Covers the screen with a borderless overlay until a password is typed."
authors = ["Joe Cox"]
license = "MIT"
repository = "https://github.com/BootBlock/OverlayLock"
readme = "README.md"
keywords = ["windows", "lock-screen", "overlay", "kiosk", "stream-deck"]
categories = ["command-line-utilities"]

[workspace]
members = [".", "xtask"]

[dependencies]
lexopt = "0.3.2"
# Vector2 for Direct2D: part of the windows crate family, which does not re-export it. Keep it at
# the version the windows crate depends on (see .github/dependabot.yml).
windows-numerics = "0.3.1"

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
